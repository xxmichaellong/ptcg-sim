name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: corepack pnpm run audit:dependencies
      - name: Run the non-browser quality gate
        run: corepack pnpm run check:ci
      - name: Verify tracked files remain unchanged
        run: git diff --exit-code

  chromium:
    name: Chromium regression gate
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Disable unrelated Chrome apt source
        run: |
          for chrome_source in \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$chrome_source" ]; then
              sudo mv "$chrome_source" "$chrome_source.disabled"
            fi
          done
      - name: Install Playwright Chromium
        run: |
          for browser_install_attempt in 1 2 3; do
            if corepack pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$browser_install_attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Playwright Chromium installation failed; retrying in 30 seconds"
            sleep 30
          done
      - name: Run browser regressions
        run: corepack pnpm run check:browser
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-chromium-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
