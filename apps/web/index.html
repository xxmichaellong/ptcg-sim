<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTCG-sim | Pokémon TCG Tabletop Simulator</title>
    <meta
      name="description"
      content="PTCG-sim is an open-source Pokémon Trading Card Game (Pokémon TCG) tabletop simulator supporting single player and online multiplayer. Simulate your favorite card game!"
    />
    <meta
      name="keywords"
      content="ptcg sim,ptcg,pokemon trading card game simulator,pokemon trading card game sim,pokemon tcg simulator,pokemon tcg sim,pokemon sim,pokemon simulator,pokemon card simulator,pokemon card sim,pokemon tabletop simulator,pokemon tabletop sim,pokemon,pokemon card,pokemonsim,pokemon game sim,ptcg os,pokemon open source"
    />
    <meta
      property="og:title"
      content="Pokémon TCG Tabletop Simulator | PTCG-sim"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/v2/assets/blank-logo.png" />
    <meta
      property="og:description"
      content="PTCG-sim is an open-source Pokémon Trading Card Game (Pokémon TCG) tabletop simulator supporting single player and online multiplayer. Simulate your favorite card game!"
    />
    <meta property="og:site_name" content="PTCG-sim" />
    <link
      rel="icon"
      href="/v2/assets/favicon.ico"
      type="image/x-icon"
      sizes="any"
    />
    <link rel="shortcut icon" href="/v2/assets/favicon.ico" />
    <script>
      // The saved theme (Night or Day) and table artwork are on the page
      // before its first paint, so the loading screen below never flashes
      // another. page-theme.ts applies the same preference again once the
      // app runs (an unknown artwork falls back to Cream there and in CSS).
      (function () {
        try {
          var table = JSON.parse(
            localStorage.getItem('ptcgsim.table.v1') || 'null'
          );
          document.documentElement.dataset.theme =
            table && table.darkMode === false ? 'day' : 'night';
          document.documentElement.dataset.tableArt =
            table && typeof table.art === 'string' ? table.art : 'cream';
        } catch (error) {}
      })();
    </script>
    <style>
      /*
       * The loading screen over the table (session/shell/table-curtain.ts).
       * It is painted here, before any stylesheet or script has loaded, so
       * it reads the design tokens with their own values as fallbacks.
       * It is only paint: it never takes the pointer.
       */
      #tableCurtain {
        /* The fallbacks are Cream's, the default artwork (table-art.css). */
        --curtain-desk: var(--color-desk, #d6c7ac);
        --curtain-desk-hi: var(--color-desk-hi, #e4d8c3);
        --curtain-shade: var(--color-desk-vignette, rgb(70 50 30 / 0.24));
        --curtain-lamp: var(--color-lamp, rgb(255 214 160 / 0.16));
        --curtain-ink: var(--color-desk-ink, #4f4337);

        position: fixed;
        inset: 0;
        z-index: var(--layer-curtain, 2500);
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            ellipse 55% 50% at 42% 40%,
            var(--curtain-lamp),
            transparent 72%
          ),
          radial-gradient(
            ellipse 85% 80% at 47% 47%,
            transparent 45%,
            var(--curtain-shade) 100%
          ),
          linear-gradient(var(--curtain-desk-hi), var(--curtain-desk));
        background-color: var(--curtain-desk);
        color: var(--curtain-ink);
        opacity: 1;
        pointer-events: none;
        transition: opacity var(--table-curtain-fade, 0ms)
          cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      :root[data-theme='day'] #tableCurtain {
        --curtain-lamp: var(--color-lamp, rgb(255 248 232 / 0.14));
      }
      #tableCurtain[hidden] {
        display: none;
      }
      /* Down, it is wholly down: a swap under it is never glimpsed. */
      #tableCurtain[data-state='covering'] {
        transition: none;
      }
      #tableCurtain[data-state='leaving'] {
        opacity: 0;
      }
      /* A short load never shows its indicator: it waits, then fades in. */
      .table-curtain__indicator {
        display: grid;
        justify-items: center;
        gap: 14px;
        animation: table-curtain-indicator 240ms ease-out 400ms both;
      }
      .table-curtain__spinner {
        box-sizing: border-box;
        width: 28px;
        height: 28px;
        border: 2.5px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.7;
        animation: table-curtain-spin 0.9s linear infinite;
      }
      .table-curtain__label {
        font:
          500 13px/1.4 'Inter Variable',
          'Inter',
          ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.01em;
      }
      @keyframes table-curtain-indicator {
        from {
          opacity: 0;
        }
      }
      @keyframes table-curtain-spin {
        to {
          rotate: 1turn;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .table-curtain__spinner {
          animation-duration: 2.4s;
        }
      }
      :root[data-motion='reduced'] .table-curtain__spinner {
        animation-duration: 2.4s;
      }
    </style>
    <script>
      // A deploy reaches Cloudflare's machines over several seconds. In that
      // window this page and its scripts can come from different versions;
      // a script the other version lacks comes back as this page, which the
      // browser refuses, and the table would stay blank. While nothing is on
      // screen, reload instead, a few times with a growing pause.
      (function () {
        var key = 'ptcgsim:stale-assets';
        var assets = location.origin + '/assets/';
        var waiting = false;
        var ours = function (url) {
          return typeof url === 'string' && url.indexOf(assets) === 0;
        };
        var failedImport = function (message) {
          message = String(message);
          return (
            (/dynamically imported module/i.test(message) &&
              message.indexOf(assets) !== -1) ||
            /Importing a module script failed/i.test(message)
          );
        };
        var showing = function () {
          return (
            document.querySelector(
              '[data-app-route]:not([data-app-route$="-loading"])'
            ) !== null
          );
        };
        var recover = function () {
          if (waiting) return;
          var now = Date.now();
          var tries = 0;
          var since = now;
          try {
            var saved = JSON.parse(sessionStorage.getItem(key) || 'null');
            if (saved && now - saved.since < 300000) {
              tries = saved.tries;
              since = saved.since;
            }
          } catch (error) {}
          if (tries >= 6) return;
          waiting = true;
          setTimeout(
            function () {
              waiting = false;
              if (showing()) return;
              try {
                sessionStorage.setItem(
                  key,
                  JSON.stringify({ tries: tries + 1, since: since })
                );
              } catch (error) {}
              location.reload();
            },
            500 * Math.pow(2, tries)
          );
        };
        window.addEventListener('vite:preloadError', recover);
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              if (ours(target.src)) recover();
            } else if (target && target.tagName === 'LINK') {
              if (ours(target.href)) recover();
            } else if (failedImport(event.message)) {
              recover();
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (event) {
          if (failedImport(event.reason && event.reason.message)) recover();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="tableCurtain"
      data-state="covering"
      role="status"
      aria-live="polite"
    >
      <div class="table-curtain__indicator">
        <span class="table-curtain__spinner" aria-hidden="true"></span>
        <span class="table-curtain__label">Setting up the table…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
