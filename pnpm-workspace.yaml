packages:
  - 'client'
  - 'server'
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  sqlite3: true
  workerd: false
overrides:
  '@humanfs/node@<0.16.8': 0.16.8
  'body-parser@<1.20.9': 1.20.9
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'engine.io@>=6.5.0 <6.6.7': 6.6.10
  'minimatch@>=3.0.0 <3.1.4': 3.1.4
  'minimatch@>=5.0.0 <5.1.8': 5.1.8
  'path-to-regexp@<0.1.13': 0.1.13
  'proxy-addr@>=1.1.0 <2.0.8': 2.0.8
  'picomatch@<2.3.2': 2.3.2
  'qs@<6.16.1': 6.16.1
  'sharp@<0.35.5': 0.35.5
  'socket.io-parser@>=4.0.0 <4.2.7': 4.2.7
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'tar-fs@>=2.0.0 <2.1.4': 2.1.5
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'ws@<8.21.0': 8.21.3
  'zod@>=4.0.0 <4.6.6': 4.6.6
auditConfig:
  ignoreGhsas:
    # braces has no patched release. It reaches the tree only through
    # nodemon -> chokidar, v1's development file watcher, which expands its own
    # configured watch patterns and never an untrusted one. Replacing nodemon
    # would change how ptcgsim.online starts, so it stays until v1 retires.
    - GHSA-vfj7-8cjw-p6xm
    # minimatch is patched only in 11, a rewrite (no makeRe or AST) that none of
    # its dependents accept yet. It reaches the tree through development tools
    # (eslint, typescript-eslint, nodemon), which match the repository's own
    # configured patterns, and through ejs -> jake, which only ejs's command
    # line uses; v1's server renders with ejs and never loads it. Drop this
    # once eslint and typescript-eslint take minimatch 11.
    - GHSA-g3hv-75wg-m249
